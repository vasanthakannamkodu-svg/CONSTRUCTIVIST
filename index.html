<script>
const BANK=[{"q":"Constructivism views learning primarily as a process of:","ml":"നിർമ്മിതിവാദം പഠനത്തെ പ്രധാനമായും ഏത് പ്രക്രിയയായാണ് കാണുന്നത്?","opts":["Passive reception","Active construction of knowledge","Mechanical repetition","Memorisation of facts"],"a":1,"ex":"Learners actively construct knowledge.","exml":"പഠിതാക്കൾ സജീവമായി അറിവ് നിർമ്മിക്കുന്നു.","optionEx":[{"en":"Passive reception refers to receiving information without active engagement.","ml":"Passive reception എന്നത് സജീവമായി പങ്കാളിയാകാതെ വിവരങ്ങൾ സ്വീകരിക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."},{"en":"Correct. Learners actively construct knowledge.","ml":"ശരിയാണ്. പഠിതാക്കൾ സജീവമായി അറിവ് നിർമ്മിക്കുന്നു."},{"en":"Mechanical repetition refers to repeating information without necessarily understanding it.","ml":"Mechanical repetition എന്നത് അർത്ഥം മനസ്സിലാക്കണമെന്നില്ലാതെ വിവരങ്ങൾ ആവർത്തിക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."},{"en":"Memorisation of facts refers to remembering facts rather than constructing explanations.","ml":"Memorisation of facts എന്നത് ആശയങ്ങൾ വിശദീകരിച്ച് മനസ്സിലാക്കുന്നതിനുപകരം വസ്തുതകൾ മനഃപാഠമാക്കുന്നതാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."}]},{"q":"A student changes an earlier explanation after testing it against new evidence and reorganising their understanding. Which perspective best explains this learning process?","ml":"പുതിയ തെളിവുകൾ പരിശോധിച്ച് സ്വന്തം ധാരണ പുനഃസംഘടിപ്പിച്ച ശേഷം ഒരു വിദ്യാർത്ഥി പഴയ വിശദീകരണം മാറ്റുന്നു. ഈ പഠനപ്രക്രിയയെ ഏറ്റവും നന്നായി വിശദീകരിക്കുന്ന സമീപനം ഏതാണ്?","opts":["Social Constructivism","Cognitive Constructivism","Brainstorming","Concept Mapping"],"a":1,"ex":"Cognitive Constructivism explains how learners actively build and reorganise knowledge through their own cognitive processes. The student is revising an individual understanding in response to evidence.","exml":"സ്വന്തം ബൗദ്ധിക പ്രക്രിയകളിലൂടെ പഠിതാക്കൾ അറിവ് സജീവമായി നിർമ്മിക്കുകയും പുനഃസംഘടിപ്പിക്കുകയും ചെയ്യുന്നതാണ് Cognitive Constructivism. തെളിവുകളുടെ അടിസ്ഥാനത്തിൽ വിദ്യാർത്ഥി സ്വന്തം ധാരണ പുതുക്കുകയാണ്.","optionEx":[{"en":"Social Constructivism emphasises learning through social interaction, language and shared activity. Those features are not central in the situation described.","ml":"സാമൂഹിക ഇടപെടൽ, ഭാഷ, കൂട്ടായ പ്രവർത്തനം എന്നിവയിലൂടെ പഠിക്കുന്നതിനാണ് Social Constructivism പ്രാധാന്യം നൽകുന്നത്. ഇവിടെ അവയാണ് പ്രധാന ഘടകങ്ങൾ എന്ന് പറയുന്നില്ല."},{"en":"Correct. The learner tests evidence and reorganises their own understanding, which reflects active cognitive construction of knowledge.","ml":"ശരിയാണ്. പഠിതാവ് തെളിവുകൾ പരിശോധിച്ച് സ്വന്തം ധാരണ പുനഃസംഘടിപ്പിക്കുന്നു; ഇത് അറിവിന്റെ സജീവമായ ബൗദ്ധിക നിർമ്മിതിയെ പ്രതിഫലിപ്പിക്കുന്നു."},{"en":"Brainstorming generates a range of ideas before evaluating them. The scenario is about revising understanding after evidence, not generating many ideas.","ml":"ആശയങ്ങൾ വിലയിരുത്തുന്നതിന് മുമ്പ് നിരവധി ആശയങ്ങൾ സൃഷ്ടിക്കുന്നതാണ് Brainstorming. ഇവിടെ നിരവധി ആശയങ്ങൾ സൃഷ്ടിക്കുന്നതല്ല, തെളിവിന്റെ അടിസ്ഥാനത്തിൽ ധാരണ പുതുക്കുന്നതാണ്."},{"en":"Concept Mapping displays concepts and their relationships visually. The scenario does not describe constructing a concept map.","ml":"ആശയങ്ങളും അവയുടെ ബന്ധങ്ങളും ദൃശ്യരൂപത്തിൽ കാണിക്കുന്നതാണ് Concept Mapping. സാഹചര്യത്തിൽ ആശയമാപ്പ് നിർമ്മിക്കുന്നതായി പറയുന്നില്ല."}]},{"q":"Social Constructivism emphasises the role of:","ml":"സാമൂഹിക നിർമ്മിതിവാദം പ്രാധാന്യം നൽകുന്നത്:","opts":["Individual memorisation","Punishment","Social interaction and language","Mechanical repetition"],"a":2,"ex":"Social interaction and language support knowledge construction.","exml":"സാമൂഹിക ഇടപെടലും ഭാഷയും അറിവ് നിർമ്മിക്കാൻ സഹായിക്കുന്നു.","optionEx":[{"en":"Individual memorisation does not best answer the question. The key concept here is Social interaction and language: Social interaction and language support knowledge construction.","ml":"Individual memorisation ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല്ല. ഇവിടെ ആവശ്യമായ ആശയം Social interaction and language ആണ്: സാമൂഹിക ഇടപെടലും ഭാഷയും അറിവ് നിർമ്മിക്കാൻ സഹായിക്കുന്നു."},{"en":"Punishment refers to a consequence intended to reduce behaviour.","ml":"Punishment എന്നത് a consequence intended to reduce behaviour എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."},{"en":"Correct. Social interaction and language support knowledge construction.","ml":"ശരിയാണ്. സാമൂഹിക ഇടപെടലും ഭാഷയും അറിവ് നിർമ്മിക്കാൻ സഹായിക്കുന്നു."},{"en":"Mechanical repetition refers to repeating information without necessarily understanding it.","ml":"Mechanical repetition എന്നത് അർത്ഥം മനസ്സിലാക്കണമെന്നില്ലാതെ വിവരങ്ങൾ ആവർത്തിക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."}]},{"q":"A teacher provides materials and asks students to discover a scientific principle through exploration. Which method is used?","ml":"പര്യവേക്ഷണത്തിലൂടെ ശാസ്ത്രീയ തത്വം കണ്ടെത്താൻ അധ്യാപകൻ വിദ്യാർത്ഥികൾക്ക് സാമഗ്രികൾ നൽകുന്നു. ഏത് രീതിയാണ് ഉപയോഗിക്കുന്നത്?","opts":["Lecture method","Discovery learning","Dictation method","Drill method"],"a":1,"ex":"Discovery learning involves exploration.","exml":"പര്യവേക്ഷണത്തിലൂടെയുള്ള പഠനമാണിത്.","optionEx":[{"en":"Lecture method refers to teacher-led verbal presentation.","ml":"Lecture method എന്നത് അധ്യാപകൻ വാക്കുകളിലൂടെ വിവരങ്ങൾ അവതരിപ്പിക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."},{"en":"Correct. Discovery learning involves exploration.","ml":"ശരിയാണ്. പര്യവേക്ഷണത്തിലൂടെയുള്ള പഠനമാണിത്."},{"en":"Dictation method refers to writing down material spoken by the teacher.","ml":"Dictation method എന്നത് അധ്യാപകൻ പറയുന്ന കാര്യങ്ങൾ വിദ്യാർത്ഥികൾ എഴുതിയെടുക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."},{"en":"Drill method refers to repeated practice of a skill or response.","ml":"Drill method എന്നത് ഒരു കഴിവോ പ്രതികരണമോ ആവർത്തിച്ച് പരിശീലിക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."}]},{"q":"Which of the following is a basic element of Cooperative Learning?","ml":"സഹകരണ പഠനത്തിന്റെ അടിസ്ഥാന ഘടകം ഏതാണ്?","opts":["Positive interdependence","Individual competition","Teacher domination","Passive listening"],"a":0,"ex":"Positive interdependence is a key element.","exml":"അനുകൂല പരസ്പരാശ്രിതത്വം പ്രധാന ഘടകമാണ്.","optionEx":[{"en":"Correct. Positive interdependence is a key element.","ml":"ശരിയാണ്. അനുകൂല പരസ്പരാശ്രിതത്വം പ്രധാന ഘടകമാണ്."},{"en":"Individual competition does not best answer the question. The key concept here is Positive interdependence: group members relying on one another to achieve a shared goal","ml":"Individual competition ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല്ല. ഇവിടെ ആവശ്യമായ ആശയം Positive interdependence ആണ്: അനുകൂല പരസ്പരാശ്രിതത്വം പ്രധാന ഘടകമാണ്."},{"en":"Teacher domination refers to the teacher controlling most decisions and talk.","ml":"Teacher domination എന്നത് ക്ലാസിലെ തീരുമാനങ്ങളും സംസാരവും അധ്യാപകൻ കൂടുതലായി നിയന്ത്രിക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."},{"en":"Passive listening refers to receiving information without active engagement.","ml":"Passive listening എന്നത് സജീവമായി പങ്കാളിയാകാതെ വിവരങ്ങൾ കേൾക്കുന്ന രീതിയാണ് എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്."}]},{"q":"In cooperative learning, individual accountability means:","ml":"സഹകരണ പഠനത്തിലെ വ്യക്തിഗത ഉത്തരവാദിത്തം എന്നതിന്റെ അർത്ഥം:","opts":["Only the group leader works","The teacher completes the task","Each learner is responsible for their learning","No individual assessment is needed"],"a":2,"ex":"Every learner is accountable for learning.","exml":"ഓരോ പഠിതാവിനും പഠന ഉത്തരവാദിത്തമുണ്ട്.","optionEx":[{"en":"Only the group leader works does not best answer the question. The key concept here is Each learner is responsible for their learning: Every learner is accountable for learning.","ml":"Only the group leader works ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല്ല. ഇവിടെ ആവശ്യമായ ആശയം Each learner is responsible for their learning ആണ്: ഓരോ പഠിതാവിനും പഠന ഉത്തരവാദിത്തമുണ്ട്."},{"en":"The teacher completes the task does not best answer the question. The key concept here is Each learner is responsible for their learning: Every learner is accountable for learning.","ml":"The teacher completes the task ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല്ല. ഇവിടെ ആവശ്യമായ ആശയം Each learner is responsible for their learning ആണ്: ഓരോ പഠിതാവിനും പഠന ഉത്തരവാദിത്തമുണ്ട്."},{"en":"Correct. Every learner is accountable for learning.","ml":"ശരിയാണ്. ഓരോ പഠിതാവിനും പഠന ഉത്തരവാദിത്തമുണ്ട്."},{"en":"No individual assessment is needed does not best answer the question. The key concept here is Each learner is responsible for their learning: Every learner is accountable for learning.","ml":"No individual assessment is needed ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല്ല. ഇവിടെ ആവശ്യമായ ആശയം Each learner is responsible for their learning ആണ്: ഓരോ പഠിതാവിനും പഠന ഉത്തരവാദിത്തമുണ്ട്."}]},{"q":"Which pair is associated with Cooperative Learning?","ml":"സഹകരണ പഠനവുമായി ബന്ധപ്പെട്ട ജോഡി ഏതാണ്?","opts":["Palincsar and Novak","Johnson and Johnson","Osborn and Hart","Piaget and Novak"],"a":1,"ex":"Johnson and Johnson are associated with cooperative learning.","exml":"ജോൺസൺ ആൻഡ് ജോൺസൺ സഹകരണ പഠനവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.","optionEx":[{"en":"Palincsar and Novak does not best answer the question. The key concept here is Johnson and Johnson: cooperative learning","ml":"Palincsar and Novak ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല്ല. ഇവിടെ ആവശ്യമായ ആശയം Johnson and Johnson ആണ്: ജോൺസൺ ആൻഡ് ജോൺസൺ സഹകരണ പഠനവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു."},{"en":"Correct. Johnson and Johnson are associated with cooperative learning.","ml":"ശരിയാണ്. ജോൺസൺ ആൻഡ് ജോൺസൺ സഹകരണ പഠനവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു."},{"en":"Osborn and Hart does not best answer the question. The key concept here is Johnson and Johnson: cooperative learning","ml":"Osborn and Hart ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല്ല. ഇവിടെ ആവശ്യമായ ആശയം Johnson and Johnson ആണ്: ജോൺസൺ ആൻഡ് ജോൺസൺ സഹകരണ പഠനവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു."},{"en":"Piaget and Novak does not best answer the question. The key concept here is Johnson and Johnson: cooperative learning","ml":"Piaget and Novak ഈ ചോദ്യത്തിന് ഏറ്റവും അനുയോജ്യമായ ഉത്തരമല const letters=['A','B','C','D'];let order=[],pos=0,score=0,answered=0,locked=false,session=[];
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(BANK.map((_,i)=>i));pos=0;score=0;answered=0;locked=false;session=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){locked=false;const d=BANK[order[pos]];const perm=shuffle([0,1,2,3]);session[pos]={idx:order[pos],perm,chosen:null};$('qnum').textContent=`QUESTION ${pos+1} / 50`;$('question').textContent=d.q;$('ml').textContent=d.ml;$('progressText').textContent=`Question ${pos+1} of ${BANK.length}`;$('scoreText').textContent=`Score: ${score}`;$('answeredText').textContent=`Answered: ${answered}`;$('progressBar').style.width=`${answered/BANK.length*100}%`;$('feedback').className='feedback hidden';$('feedback').innerHTML='';$('next').disabled=true;$('next').textContent=pos===BANK.length-1?'Finish / പൂർത്തിയാക്കുക':'Next Question / അടുത്ത ചോദ്യം';$('options').innerHTML='';perm.forEach((originalIndex,displayIndex)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${letters[displayIndex]}</span><span>${escapeHtml(d.opts[originalIndex])}</span>`;b.addEventListener('click',()=>choose(originalIndex,displayIndex));$('options').appendChild(b)})}
function playFeedbackSound(isCorrect){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const now=ctx.currentTime;function tone(freq,start,duration,type,volume){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now+start);gain.gain.setValueAtTime(0.0001,now+start);gain.gain.exponentialRampToValueAtTime(volume,now+start+0.02);gain.gain.exponentialRampToValueAtTime(0.0001,now+start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+start);osc.stop(now+start+duration+0.03)}if(isCorrect){tone(660,0,0.16,'sine',0.16);tone(880,0.13,0.22,'sine',0.16);tone(1100,0.28,0.24,'sine',0.14)}else{tone(220,0,0.20,'square',0.09);tone(165,0.18,0.25,'square',0.08)}setTimeout(()=>ctx.close().catch(()=>{}),900)}catch(e){}}
function choose(originalIndex,displayIndex){if(locked)return;locked=true;const d=BANK[order[pos]],s=session[pos];s.chosen=originalIndex;answered++;const correct=originalIndex===d.a;if(correct){try{const music=$('correctAnswerMusic');music.pause();music.currentTime=0;music.volume=1;const playback=music.play();if(playback&&playback.catch)playback.catch(()=>{});}catch(e){}}else{playFeedbackSound(false)}if(correct)score++;[...$('options').children].forEach((b,i)=>{const oi=s.perm[i];b.disabled=true;if(oi===d.a)b.classList.add('correct');else if(oi===originalIndex)b.classList.add('wrong')});const f=$('feedback');f.className='feedback '+(correct?'good':'bad');let html=`<h3>${correct?'Correct! ശരിയുത്തരം':'Not quite. ശരിയുത്തരം'}</h3><p><b>Correct answer: ${letters[s.perm.indexOf(d.a)]}. ${escapeHtml(d.opts[d.a])}</b></p><p>${escapeHtml(d.ex)}</p><p>${escapeHtml(d.exml)}</p><div class="choice-explanations"><b>What each option means / ഓരോ ഓപ്ഷന്റെയും അർത്ഥവും വിശദീകരണവും</b>`;s.perm.forEach((oi,di)=>{const e=d.optionEx[oi];html+=`<div class="explain ${oi===d.a?'right':''}"><b>${letters[di]}. ${escapeHtml(d.opts[oi])} ${oi===d.a?'✓':''}</b><div>${escapeHtml(e.en)}</div><div>${escapeHtml(e.ml)}</div></div>`});html+='</div>';f.innerHTML=html;$('scoreText').textContent=`Score: ${score}`;$('answeredText').textContent=`Answered: ${answered}`;$('progressBar').style.width=`${answered/BANK.length*100}%`;$('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!locked)return;if(pos<BANK.length-1){pos++;render();window.scrollTo({top:0,behavior:'smooth'})}else{showResult()}}
function showResult(){$('quiz').classList.add('hidden');const r=$('result');r.classList.remove('hidden');r.innerHTML=`<h2>Test Completed / പരീക്ഷ പൂർത്തിയായി</h2><p><strong>Score: ${score} / ${BANK.length}</strong></p><p>Correct: ${score} · Incorrect: ${answered-score}</p><p>Review the explanations and restart for a newly shuffled question set.</p><button class="btn primary" id="restartResult">Restart with New Order / പുതിയ ക്രമത്തിൽ വീണ്ടും തുടങ്ങുക</button>`;$('restartResult').addEventListener('click',start);r.scrollIntoView({behavior:'smooth'})}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('restart').addEventListener('click',start);$('next').addEventListener('click',next);start();
</script></body></html>
